version: '3.8'

services:
  thunai-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thunai-agricultural-platform
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - PROJECT_NAME="THUNAI Agricultural Intelligence"
    volumes:
      - thunai_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  thunai_data:
